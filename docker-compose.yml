name: mantenimiento

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mantenimiento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-mantenimiento}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      # Se compone a partir de las variables de PostgreSQL para que no se desincronicen.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mantenimiento}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mantenimiento}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      OPERATION_TIMEZONE: ${OPERATION_TIMEZONE:-Europe/Madrid}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
